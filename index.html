<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>코드러너 항해일지 — 사이버보안 탐험 기록</title>
  <meta name="description" content="픽셀 판타지 세계관으로 풀어낸 사이버보안 학습 및 해킹 실습 기록 블로그" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <nav class="nav" aria-label="주요 메뉴">
      <a class="nav__brand" href="#hero">코드러너 항해일지</a>

      <button
        class="nav__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="nav-menu"
      >
        <span class="sr-only">메뉴 열기</span>
        <span class="nav__toggle-icon" aria-hidden="true"></span>
      </button>

      <ul class="nav__menu" id="nav-menu" data-state="closed">
        <li><a href="#/archive" id="nav-archive-link">아카이브</a></li>
        <li><a href="#">카테고리</a></li>
        <li><a href="#">소개</a></li>
        <li><a href="#">검색</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <section class="hero" id="hero">
      <div class="hero__layer hero__layer--sky" aria-hidden="true"></div>
      <div class="hero__layer hero__layer--palace" aria-hidden="true"></div>
      <div class="hero__layer hero__layer--traveler" aria-hidden="true"></div>
      <div class="hero__overlay" aria-hidden="true"></div>

      <div class="hero__content">
        <p class="hero__eyebrow">EXPLORER'S JOURNAL</p>
        <h1 class="hero__title">잊혀진 지식을 찾아 떠나는 여정</h1>
        <p class="hero__subtitle">
          하늘 위 궁전과 용이 지키는 세계에서, 한 명의 탐험가가 사이버보안의
          오래된 비밀을 하나씩 기록합니다.
        </p>

        <dl class="status-panel" aria-label="탐험가 상태 정보">
          <div class="status-panel__row">
            <dt>플레이어</dt>
            <dd>시큐리티 탐험가</dd>
          </div>
          <div class="status-panel__row">
            <dt>상태</dt>
            <dd>학습 중</dd>
          </div>
          <div class="status-panel__row">
            <dt>진행 중인 퀘스트</dt>
            <dd>OSCP / HTB</dd>
          </div>
          <div class="status-panel__row">
            <dt>발견한 기록</dt>
            <dd>24개</dd>
          </div>
        </dl>
      </div>

      <a class="hero__scroll-cue" href="#latest-posts">
        <span class="sr-only">최신 기록으로 이동</span>
        <span aria-hidden="true">▾</span>
      </a>
    </section>

    <section class="latest-posts" id="latest-posts" aria-labelledby="latest-posts-heading">
      <h2 class="latest-posts__heading" id="latest-posts-heading">최신 탐험 기록</h2>

      <div class="post-grid" id="post-grid"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div
      class="modal scroll-frame"
      id="post-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      tabindex="-1"
    >
      <header class="modal__titlebar">
        <span class="modal__category" id="modal-category"></span>
        <h2 class="modal__title" id="modal-title"></h2>
        <a class="modal__open-page" id="modal-open-page" href="#">페이지 열기</a>
        <button class="modal__close" id="modal-close" type="button">
          <span class="sr-only">닫기</span>
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <div class="archive-backdrop" id="archive-backdrop" hidden>
    <div
      class="archive scroll-frame"
      id="archive-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="archive-title"
      tabindex="-1"
      data-mobile-view="list"
    >
      <header class="archive__titlebar">
        <button class="archive__back" id="archive-back" type="button" hidden>
          <span aria-hidden="true">←</span>
          <span>목록</span>
        </button>
        <h2 class="archive__title" id="archive-title">탐험 기록 아카이브</h2>
        <button class="archive__close" id="archive-close" type="button">
          <span class="sr-only">닫기</span>
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <div class="archive__body" id="archive-body">
        <div class="archive__list-pane" id="archive-list-pane">
          <div class="archive__search">
            <label class="sr-only" for="archive-search">기록 검색</label>
            <input
              type="search"
              id="archive-search"
              class="archive__search-input"
              placeholder="퀘스트 검색..."
              autocomplete="off"
            />
          </div>
          <nav class="archive__list" id="archive-list" aria-label="퀘스트 목록"></nav>
        </div>

        <div class="archive__detail-pane" id="archive-detail-pane">
          <div class="archive__detail" id="archive-detail">
            <p class="archive__empty">탐험할 기록을 선택하세요</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/parallax.js"></script>
  <script src="assets/js/vendor/marked.min.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/posts.js"></script>
  <script src="assets/js/archive.js"></script>
</body>
</html>
